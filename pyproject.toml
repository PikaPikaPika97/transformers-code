[project]
name = "transformers-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.5",
    "evaluate>=0.4.6",
    "huggingface-hub>=1.16.1",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.9",
    "nltk>=3.9.4",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "requests>=2.34.2",
    "rouge-chinese>=1.0.3",
    "scikit-learn>=1.8.0",
    "sentencepiece>=0.2.1",
    "seqeval>=1.2.2",
    "tensorboard>=2.20.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "transformers>=5.9.0",
]

# 普通包优先级：清华源 -> 阿里源 -> 华为源 -> PyPI
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[[tool.uv.index]]
name = "huawei"
url = "https://repo.huaweicloud.com/repository/pypi/simple"

# PyTorch CPU wheel 源，只给 torch 显式使用
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# PyTorch CUDA 12.8 wheel 源，只给 torch 显式使用
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# PyPI 官方源，最后兜底
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true


# PyTorch CUDA 索引 —— 仅用于 torch 系列包
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [ { index = "pytorch-cu126" } ]
torchvision = [ { index = "pytorch-cu126" } ]
torchaudio = [ { index = "pytorch-cu126" } ]
